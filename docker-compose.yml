services:
  mysql:
    image: mysql:8.4
    container_name: um_project_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-UM_ProjectDB}
      MYSQL_USER: ${MYSQL_USER:-umuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-um_change_me}
    ports:
      - "3306:3306"
    volumes:
      - um_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-root_change_me}",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: um_project_web
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Docker}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-UM_ProjectDB};
        User=${MYSQL_USER:-umuser};Password=${MYSQL_PASSWORD:-um_change_me};
      Database__ApplyMigrationsOnStartup: "true"
      Database__ApplySchemaBootstrapOnStartup: "true"
      Database__SeedOnStartup: "true"
      Database__ReseedDemoData: "false"
      Jwt__Secret: ${JWT_SECRET:-UM_Project_SuperSecret_Key_Change_In_Production_2026!}
      Jwt__Issuer: UM_Project
      Jwt__Audience: UM_Project
      EmailSettings__SmtpServer: ${SMTP_SERVER:-}
      EmailSettings__SmtpPort: ${SMTP_PORT:-587}
      EmailSettings__SenderEmail: ${SMTP_SENDER_EMAIL:-}
      EmailSettings__SenderPassword: ${SMTP_SENDER_PASSWORD:-}
    env_file:
      - path: .env
        required: false

volumes:
  um_mysql_data:
